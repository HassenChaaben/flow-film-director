name: Pylint

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Codebase with Pylint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pylint numpy opencv-python-headless requests pydantic
          pip install -e . --no-deps

      - name: Analysing the code with pylint
        run: |
          # Audit core source files and scripts for syntax & critical runtime errors
          pylint --errors-only --disable=import-error src/flow_film_director/ install.py
