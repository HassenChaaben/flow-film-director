[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flow-film-director"
version = "1.2.0"
description = "The Autonomous AI Film Crew for Google Flow & Programmatic Video Engineering"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Hassen Ben Chaaben", email = "hassen.benchaaben01@gmail.com" }
]
keywords = [
    "google-flow",
    "video-generation",
    "ai-filmmaking",
    "remotion",
    "voicebox",
    "claude-code",
    "antigravity",
    "mcp",
    "veo",
    "omni"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pylint>=3.0.0",
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/HassenChaaben/flow-film-director"
Documentation = "https://github.com/HassenChaaben/flow-film-director#readme"
Repository = "https://github.com/HassenChaaben/flow-film-director.git"
"Pro Studio (Agensi)" = "https://www.agensi.io/skills/flow-film-director"

[project.scripts]
flow-film-director = "flow_film_director.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
